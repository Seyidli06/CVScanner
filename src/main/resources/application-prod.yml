spring:
  datasource:
    url: ${CVSCANNER_DB_URL}
    username: ${CVSCANNER_DB_USERNAME}
    password: ${CVSCANNER_DB_PASSWORD}

    hikari:
      maximum-pool-size: ${CVSCANNER_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${CVSCANNER_DB_MIN_IDLE:2}
      connection-timeout: ${CVSCANNER_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${CVSCANNER_DB_VALIDATION_TIMEOUT_MS:3000}

security:
  jwt:
    issuer-uri: ${CVSCANNER_JWT_ISSUER_URI}
    jwk-set-uri: ${CVSCANNER_JWT_JWK_SET_URI}
    roles-claim: ${CVSCANNER_JWT_ROLES_CLAIM:roles}

app:
  upload:
    storage-root: ${CVSCANNER_STORAGE_ROOT}

  rate-limit:
    redis-uri: ${CVSCANNER_RATE_LIMIT_REDIS_URI}

server:
  port: ${SERVER_PORT:8080}

  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never