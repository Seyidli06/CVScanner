services:

  postgres:
    image: postgres:16-alpine
    container_name: cvscanner-postgres

    environment:
      POSTGRES_DB: cvscanner
      POSTGRES_USER: cvscanner
      POSTGRES_PASSWORD: cvscanner

    ports:
      - "5435:5432"

    volumes:
      - cvscanner_postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: cvscanner-redis

    ports:
      - "6385:6379"

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


volumes:

  cvscanner_postgres_data: