services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${CVSCANNER_DB_NAME:-cvscanner}
      POSTGRES_USER: ${CVSCANNER_DB_USERNAME:?CVSCANNER_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${CVSCANNER_DB_PASSWORD:?CVSCANNER_DB_PASSWORD is required}

    volumes:
      - cvscanner-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - backend


  cvscanner:
    image: cvscanner:${CVSCANNER_IMAGE_TAG:-0.0.1}
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080

      CVSCANNER_DB_URL: jdbc:postgresql://postgres:5432/${CVSCANNER_DB_NAME:-cvscanner}
      CVSCANNER_DB_USERNAME: ${CVSCANNER_DB_USERNAME:?CVSCANNER_DB_USERNAME is required}
      CVSCANNER_DB_PASSWORD: ${CVSCANNER_DB_PASSWORD:?CVSCANNER_DB_PASSWORD is required}

      CVSCANNER_JWT_ISSUER_URI: ${CVSCANNER_JWT_ISSUER_URI:?CVSCANNER_JWT_ISSUER_URI is required}
      CVSCANNER_JWT_JWK_SET_URI: ${CVSCANNER_JWT_JWK_SET_URI:?CVSCANNER_JWT_JWK_SET_URI is required}
      CVSCANNER_JWT_ROLES_CLAIM: ${CVSCANNER_JWT_ROLES_CLAIM:-roles}

      CVSCANNER_RATE_LIMIT_REDIS_URI: redis://redis:6379
      CVSCANNER_RATE_LIMIT_FAIL_OPEN: "false"

      CVSCANNER_STORAGE_ROOT: /app/storage/uploads

      CVSCANNER_DB_MAX_POOL_SIZE: ${CVSCANNER_DB_MAX_POOL_SIZE:-10}
      CVSCANNER_DB_MIN_IDLE: ${CVSCANNER_DB_MIN_IDLE:-2}
      CVSCANNER_DB_CONNECTION_TIMEOUT_MS: ${CVSCANNER_DB_CONNECTION_TIMEOUT_MS:-5000}
      CVSCANNER_DB_VALIDATION_TIMEOUT_MS: ${CVSCANNER_DB_VALIDATION_TIMEOUT_MS:-3000}

    ports:
      - "${CVSCANNER_HTTP_PORT:-8080}:8080"

    volumes:
      - cvscanner-upload-data:/app/storage/uploads

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 40s

    networks:
      - backend
      - edge


volumes:
  cvscanner-postgres-data:
  cvscanner-upload-data:


networks:
  backend:
    internal: true

  edge: